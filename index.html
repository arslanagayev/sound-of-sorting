<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d3e2c" />
    <title>Sound of Sorting</title>
    <meta
      name="description"
      content="Watch and hear sorting algorithms: bubble, insertion, selection, merge, quick and heap sort, alone or racing each other."
    />
    <meta property="og:title" content="Sound of Sorting" />
    <meta
      property="og:description"
      content="Watch and hear six sorting algorithms, or race them on the same data."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <h1>Sound of <em>Sorting</em></h1>
          <p class="lede">
            Watch and hear how sorting algorithms work. Every comparison plays a note.
          </p>
        </div>
        <div class="modes" role="radiogroup" aria-label="Mode">
          <button type="button" role="radio" data-mode="solo" aria-checked="true">Solo</button>
          <button type="button" role="radio" data-mode="race" aria-checked="false">
            Race all six
          </button>
        </div>
      </header>

      <main class="stage" data-stage>
        <div class="lanes" data-lanes></div>
        <aside class="info" data-info aria-live="polite"></aside>
      </main>

      <footer class="controls">
        <button type="button" class="play" data-play aria-keyshortcuts="Space">Play</button>
        <button type="button" data-step aria-keyshortcuts="ArrowRight">Step</button>
        <button type="button" data-shuffle aria-keyshortcuts="R">Shuffle</button>
        <label class="field" data-algo-field>
          <span>Algorithm</span>
          <select data-algo></select>
        </label>
        <label class="field">
          <span>Data</span>
          <select data-preset></select>
        </label>
        <label class="field range">
          <span>Bars <output data-size-out>64</output></span>
          <input type="range" data-size min="8" max="256" step="8" value="64" />
        </label>
        <label class="field range">
          <span>Speed <output data-speed-out>×1</output></span>
          <input type="range" data-speed min="0" max="100" value="40" />
        </label>
        <button type="button" class="sound" data-sound aria-pressed="true" aria-keyshortcuts="M">
          Sound on
        </button>
        <p class="keys" aria-hidden="true">Space play · → step · R shuffle · M mute</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
